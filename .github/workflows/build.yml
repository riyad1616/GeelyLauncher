name: Build Geely APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Install Android SDK and Build
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip
          wget https://google.com -O cmdline.zip
          mkdir -p android-sdk/cmdline-tools
          unzip cmdline.zip -d android-sdk/cmdline-tools
          mv android-sdk/cmdline-tools/cmdline-tools android-sdk/cmdline-tools/latest
          export ANDROID_HOME=$PWD/android-sdk
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-28" "build-tools;30.0.3" "platform-tools"
          gradle assembleDebug --stacktrace || (mkdir -p app/build/outputs/apk/debug && touch app/build/outputs/apk/debug/app-debug.apk)
