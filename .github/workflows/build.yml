name: Build Geely APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Build Android APK
        uses: kevin-david/android-build-action@v1.4
        with:
          project-root: '.'

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: geely-launcher-apk
          path: "**/*.apk"
